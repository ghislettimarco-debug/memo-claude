name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Installa dipendenze
        run: npm install

      - name: Compila la parte web (Tailwind + Lucide in locale)
        run: npm run build:web

      - name: Genera il progetto Android
        run: npx cap add android

      - name: Personalizza Android (permessi notifiche, icona notifica, versione)
        run: node scripts/patch-android.mjs
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}

      - name: Genera icone e splash screen
        run: npx capacitor-assets generate --android

      - name: Sincronizza Capacitor
        run: npx cap sync android

      # Chiave di firma fissa: gli aggiornamenti si installano sopra la versione precedente senza perdere i dati
      - name: Usa il keystore del repository
        run: |
          mkdir -p ~/.android
          cp keystore/debug.keystore ~/.android/debug.keystore

      - uses: gradle/actions/setup-gradle@v4

      - name: Compila APK
        run: ./gradlew assembleDebug
        working-directory: android

      - uses: actions/upload-artifact@v4
        with:
          name: memo-corsi-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
