<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Memo Corsi</title>
  
  <!-- Tailwind CSS compilato in fase di build (dark mode via classe, vedi tailwind.config.js) -->
  <link rel="stylesheet" href="tailwind.css">
  <!-- Lucide Icons (copia locale, funziona offline) -->
  <script src="lucide.min.js"></script>
  
  <style>
    :root {
      --sat: max(env(safe-area-inset-top, 0px), var(--safe-area-inset-top, 0px));
      --sab: max(env(safe-area-inset-bottom, 0px), var(--safe-area-inset-bottom, 0px));
    }
    header.sticky { padding-top: calc(1rem + var(--sat)); }
    .fixed.bottom-0.left-0.right-0 { padding-bottom: calc(1rem + var(--sab)); }
    #modal-course > div, #modal-template > div { padding-bottom: calc(1.5rem + var(--sab)); }
    body { -webkit-tap-highlight-color: transparent; }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .dark input[type="datetime-local"]::-webkit-calendar-picker-indicator {
      filter: invert(0.85);
      cursor: pointer;
    }
  </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen pb-24 font-sans antialiased selection:bg-indigo-500 selection:text-white transition-colors duration-200">

  <!-- HEADER -->
  <header class="sticky top-0 z-30 bg-white/80 dark:bg-slate-950/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-800/80 px-5 py-4 flex items-center justify-between">
    <h1 class="text-xl font-bold tracking-tight text-slate-900 dark:text-white">Memo Corsi</h1>
    <div class="flex items-center gap-2">
      <!-- Pulsante Cambio Tema (Light/Dark) -->
      <button onclick="toggleTheme()" id="theme-btn" aria-label="Cambia tema" class="p-2.5 rounded-xl bg-slate-100 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-800 transition">
        <i data-lucide="moon" class="w-5 h-5"></i>
      </button>
      <!-- Pulsante Notifiche -->
      <button onclick="requestNotificationPermission()" id="notif-btn" aria-label="Abilita notifiche" class="p-2.5 rounded-xl bg-slate-100 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-800 transition">
        <i data-lucide="bell" class="w-5 h-5"></i>
      </button>
    </div>
  </header>

  <!-- CONTENUTO PRINCIPALE -->
  <main class="max-w-md mx-auto px-4 pt-4">

    <!-- SELETTORE SCHEDA -->
    <div class="flex bg-slate-200/70 dark:bg-slate-900 border border-slate-200 dark:border-slate-800/80 p-1 rounded-xl mb-4 text-xs font-semibold">
      <button onclick="switchTab('courses')" id="tab-courses" class="flex-1 py-2 rounded-lg bg-white dark:bg-slate-800 text-slate-900 dark:text-white shadow-sm transition">Corsi Attivi</button>
      <button onclick="switchTab('templates')" id="tab-templates" class="flex-1 py-2 rounded-lg text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition">Modelli Azioni</button>
    </div>

    <!-- VISTA 1: CORSI -->
    <section id="view-courses" class="space-y-4">
      <div id="course-list" class="space-y-3">
        <!-- Generato via JavaScript -->
      </div>
      <div id="empty-courses" class="hidden text-center py-12 px-4">
        <div class="w-12 h-12 rounded-2xl bg-indigo-50 dark:bg-indigo-950/60 border border-indigo-100 dark:border-indigo-900/40 text-indigo-600 dark:text-indigo-400 mx-auto flex items-center justify-center mb-3 shadow-inner">
          <i data-lucide="calendar-clock" class="w-6 h-6"></i>
        </div>
        <p class="text-sm font-semibold text-slate-700 dark:text-slate-200">Nessun corso programmato</p>
        <p class="text-xs text-slate-400 mt-1">Pianifica un corso indicando data e orario d'inizio.</p>
      </div>
    </section>

    <!-- VISTA 2: TEMPLATE / MODELLI -->
    <section id="view-templates" class="hidden space-y-4">
      <div class="flex items-center justify-between">
        <h2 class="text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider">Modelli Salvati</h2>
        <button onclick="openTemplateModal()" class="text-xs font-semibold text-indigo-600 dark:text-indigo-400 hover:underline flex items-center gap-1 transition">
          <i data-lucide="plus" class="w-4 h-4"></i> Nuovo Modello
        </button>
      </div>
      <div id="template-list" class="space-y-3">
        <!-- Generato via JavaScript -->
      </div>
    </section>
  </main>

  <!-- BARRA AZIONI FISSA IN BASSO -->
  <div class="fixed bottom-0 left-0 right-0 p-4 bg-gradient-to-t from-slate-50 via-slate-50/90 to-transparent dark:from-slate-950 dark:via-slate-950/90 dark:to-transparent pointer-events-none flex justify-center">
    <button onclick="openModal('modal-course')" class="pointer-events-auto shadow-lg shadow-indigo-600/20 flex items-center gap-2 bg-indigo-600 active:scale-95 hover:bg-indigo-500 text-white px-6 py-3.5 rounded-full font-semibold text-sm transition">
      <i data-lucide="plus" class="w-5 h-5"></i>
      <span>Pianifica Nuovo Corso</span>
    </button>
  </div>

  <!-- MODAL: CREA CORSO -->
  <div id="modal-course" class="fixed inset-0 z-50 bg-black/50 dark:bg-black/75 backdrop-blur-sm hidden items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 w-full max-w-md rounded-t-3xl sm:rounded-2xl p-6 space-y-4 max-h-[90vh] overflow-y-auto">
      <div class="flex items-center justify-between pb-3 border-b border-slate-100 dark:border-slate-800">
        <h3 class="text-base font-bold text-slate-900 dark:text-white">Nuovo Corso</h3>
        <button onclick="closeModal('modal-course')" class="text-slate-400 hover:text-slate-700 dark:hover:text-white transition">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <form id="form-course" onsubmit="saveCourse(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1.5">Nome del Corso</label>
          <input type="text" id="course-name" required placeholder="Es. Antincendio Livello 1" class="w-full text-sm px-3.5 py-2.5 rounded-xl bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 text-slate-900 dark:text-slate-100 placeholder-slate-400 dark:placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1.5">Data e Ora di Inizio</label>
          <input type="datetime-local" id="course-datetime" required class="w-full text-sm px-3.5 py-2.5 rounded-xl bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 text-slate-900 dark:text-slate-100 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1.5">Modello Azioni / Checklist</label>
          <select id="course-template-select" class="w-full text-sm px-3.5 py-2.5 rounded-xl bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 text-slate-900 dark:text-slate-100 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition">
            <!-- Opzioni dinamiche -->
          </select>
          <p class="text-[11px] text-slate-400 mt-1.5">Le scadenze verranno calcolate a ritroso o in avanti rispetto alla data/ora del corso.</p>
        </div>

        <button type="submit" class="w-full py-3 rounded-xl bg-indigo-600 hover:bg-indigo-500 active:scale-98 text-white font-semibold text-sm transition">Crea e Calcola Scadenze</button>
      </form>
    </div>
  </div>

  <!-- MODAL: CREA / MODIFICA MODELLO -->
  <div id="modal-template" class="fixed inset-0 z-50 bg-black/50 dark:bg-black/75 backdrop-blur-sm hidden items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 w-full max-w-md rounded-t-3xl sm:rounded-2xl p-6 space-y-4 max-h-[90vh] overflow-y-auto">
      <div class="flex items-center justify-between pb-3 border-b border-slate-100 dark:border-slate-800">
        <h3 id="modal-tpl-title" class="text-base font-bold text-slate-900 dark:text-white">Nuovo Modello di Azioni</h3>
        <button onclick="closeModal('modal-template')" class="text-slate-400 hover:text-slate-700 dark:hover:text-white transition">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <form id="form-template" onsubmit="saveTemplate(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1.5">Nome Modello</label>
          <input type="text" id="tpl-name" required placeholder="Es. Standard Corsi Sicurezza" class="w-full text-sm px-3.5 py-2.5 rounded-xl bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 text-slate-900 dark:text-slate-100 placeholder-slate-400 dark:placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition">
        </div>

        <div class="space-y-2">
          <div class="flex items-center justify-between">
            <div>
              <label class="text-xs font-semibold text-slate-700 dark:text-slate-300">Attività & Anticipo</label>
              <span class="block text-[10px] text-slate-400">Usa segno meno (-) per le azioni prima dell'inizio</span>
            </div>
            <button type="button" onclick="addTemplateActionRow()" class="text-xs text-indigo-600 dark:text-indigo-400 font-semibold hover:underline transition">+ Riga</button>
          </div>
          
          <div id="tpl-actions-container" class="space-y-2.5">
            <!-- Righe inserite via JS -->
          </div>
        </div>

        <button type="submit" id="btn-save-tpl" class="w-full py-3 rounded-xl bg-indigo-600 hover:bg-indigo-500 active:scale-98 text-white font-semibold text-sm transition">Salva Modello</button>
      </form>
    </div>
  </div>

  <script>
    // --- PONTE NATIVO CAPACITOR (nel browser non fa nulla) ---
    const NativeBridge = (() => {
      const cap = window.Capacitor;
      const native = !!(cap && cap.isNativePlatform && cap.isNativePlatform());
      const P = () => (cap && cap.Plugins) || {};
      const CHANNEL = 'scadenze';
      const numId = s => { let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0; return Math.abs(h) % 2147483646 + 1; };

      async function granted() {
        try { return (await P().LocalNotifications.checkPermissions()).display === 'granted'; } catch (e) { return false; }
      }

      // Ripianifica tutte le scadenze future non completate (attive anche ad app chiusa)
      async function sync() {
        if (!native || !(await granted())) return;
        try {
          const LN = P().LocalNotifications;
          await LN.createChannel({ id: CHANNEL, name: 'Scadenze corsi', importance: 4, visibility: 1 });
          const pending = await LN.getPending();
          if (pending.notifications.length) await LN.cancel({ notifications: pending.notifications });
          const now = Date.now(), list = [];
          courses.forEach(c => c.tasks.forEach(t => {
            const at = new Date(t.dateTime);
            if (!t.completed && at.getTime() > now) list.push({
              id: numId(c.id + t.id), channelId: CHANNEL,
              title: `Scadenza: ${c.name}`,
              body: `${t.text} (${formatDateTime(t.dateTime)})`,
              schedule: { at, allowWhileIdle: true }
            });
          }));
          if (list.length) await LN.schedule({ notifications: list });
        } catch (e) { console.error('Notifiche native:', e); }
      }

      async function requestPermission() {
        try {
          const LN = P().LocalNotifications;
          const res = await LN.requestPermissions();
          if (res.display !== 'granted') { alert('Notifiche non consentite. Puoi abilitarle dalle impostazioni di sistema.'); return; }
          await sync();
          await LN.schedule({ notifications: [{
            id: numId('test'), channelId: CHANNEL,
            title: 'Notifiche Memo Corsi Attive',
            body: 'Riceverai avvisi puntuali per tutte le scadenze impostate.',
            schedule: { at: new Date(Date.now() + 1000) }
          }] });
        } catch (e) { console.error('Permesso notifiche:', e); }
      }

      // Icone della barra di stato coerenti con il tema scelto nell'app
      function setTheme(isDark) {
        if (!native) return;
        try { P().SystemBars.setStyle({ style: isDark ? 'DARK' : 'LIGHT' }); } catch (e) {}
      }

      function init() {
        if (!native) return;
        const App = P().App;
        if (!App) return;
        // Tasto indietro: chiude la finestra aperta, altrimenti esce dall'app
        App.addListener('backButton', () => {
          const open = ['modal-course', 'modal-template'].find(id => !document.getElementById(id).classList.contains('hidden'));
          if (open) closeModal(open); else App.exitApp();
        });
        App.addListener('appStateChange', s => { if (s.isActive) sync(); });
      }

      return { native, sync, requestPermission, setTheme, init };
    })();

  </script>

  <script>
    // --- GESTIONE TEMA CHIARO / SCURO ---
    function applyTheme(theme) {
      const isDark = theme === 'dark';
      document.documentElement.classList.toggle('dark', isDark);
      localStorage.setItem('memo_corsi_theme', theme);
      
      const metaTheme = document.querySelector('meta[name="theme-color"]');
      if (metaTheme) metaTheme.setAttribute('content', isDark ? '#020617' : '#ffffff');
      NativeBridge.setTheme(isDark);

      const btn = document.getElementById('theme-btn');
      if (btn) {
        btn.innerHTML = `<i data-lucide="${isDark ? 'sun' : 'moon'}" class="w-5 h-5"></i>`;
        lucide.createIcons();
      }
    }

    function toggleTheme() {
      const currentTheme = document.documentElement.classList.contains('dark') ? 'dark' : 'light';
      applyTheme(currentTheme === 'dark' ? 'light' : 'dark');
    }

    // Inizializza tema memorizzato o preferenza dispositivo
    const initialTheme = localStorage.getItem('memo_corsi_theme') || 
      (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    applyTheme(initialTheme);

    // --- STATO INIZIALE & PERSISTENZA ---
    const DEFAULT_TEMPLATES = [
      {
        id: 'tpl-1',
        title: 'Corso Standard con Orari',
        items: [
          { text: 'Inviare convocazione corsisti', daysOffset: -3, hoursOffset: 0 },
          { text: 'Inviare link Zoom e registro al docente', daysOffset: 0, hoursOffset: -2 },
          { text: 'Controllo connessione e avvio aula', daysOffset: 0, hoursOffset: 0 },
          { text: 'Verificare firme registro presenze', daysOffset: 0, hoursOffset: 4 },
          { text: 'Emissione e invio attestati', daysOffset: 2, hoursOffset: 0 }
        ]
      }
    ];

    let templates = JSON.parse(localStorage.getItem('memo_corsi_templates')) || DEFAULT_TEMPLATES;
    let courses = JSON.parse(localStorage.getItem('memo_corsi_courses')) || [];
    let editingTemplateId = null;

    function syncStorage() {
      localStorage.setItem('memo_corsi_templates', JSON.stringify(templates));
      localStorage.setItem('memo_corsi_courses', JSON.stringify(courses));
      render();
      NativeBridge.sync();
    }

    // --- NAVIGAZIONE SCHEDE ---
    function switchTab(tab) {
      const isCourses = tab === 'courses';
      document.getElementById('view-courses').classList.toggle('hidden', !isCourses);
      document.getElementById('view-templates').classList.toggle('hidden', isCourses);

      const tabC = document.getElementById('tab-courses');
      const tabT = document.getElementById('tab-templates');

      const activeClass = "flex-1 py-2 rounded-lg bg-white dark:bg-slate-800 text-slate-900 dark:text-white shadow-sm transition font-semibold";
      const inactiveClass = "flex-1 py-2 rounded-lg text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition";

      tabC.className = isCourses ? activeClass : inactiveClass;
      tabT.className = isCourses ? inactiveClass : activeClass;
    }

    // --- MODALI ---
    function openModal(id) {
      if (id === 'modal-course') {
        populateTemplateSelect();
        const d = new Date();
        d.setDate(d.getDate() + 1);
        d.setHours(9, 0, 0, 0);
        const isoLocal = new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 16);
        document.getElementById('course-datetime').value = isoLocal;
      }
      document.getElementById(id).classList.remove('hidden');
      document.getElementById(id).classList.add('flex');
    }

    function closeModal(id) {
      document.getElementById(id).classList.add('hidden');
      document.getElementById(id).classList.remove('flex');
      if (id === 'modal-template') editingTemplateId = null;
    }

    // --- GESTIONE MODIFICA E CREAZIONE TEMPLATE ---
    function openTemplateModal(templateId = null) {
      editingTemplateId = templateId;
      const modalTitle = document.getElementById('modal-tpl-title');
      const submitBtn = document.getElementById('btn-save-tpl');
      const container = document.getElementById('tpl-actions-container');
      container.innerHTML = '';

      if (templateId) {
        const tpl = templates.find(t => t.id === templateId);
        if (!tpl) return;
        modalTitle.textContent = "Modifica Modello";
        submitBtn.textContent = "Salva Modifiche";
        document.getElementById('tpl-name').value = tpl.title;
        tpl.items.forEach(item => {
          addTemplateActionRow(item.text, item.daysOffset, item.hoursOffset);
        });
      } else {
        modalTitle.textContent = "Nuovo Modello di Azioni";
        submitBtn.textContent = "Salva Modello";
        document.getElementById('form-template').reset();
        addTemplateActionRow('Inviare convocazione', -3, 0);
        addTemplateActionRow('Inviare link Zoom docente', 0, -2);
        addTemplateActionRow('Avvio aula e verifica', 0, 0);
      }

      document.getElementById('modal-template').classList.remove('hidden');
      document.getElementById('modal-template').classList.add('flex');
      lucide.createIcons();
    }

    function addTemplateActionRow(text = '', days = 0, hours = -1) {
      const container = document.getElementById('tpl-actions-container');
      const div = document.createElement('div');
      div.className = "flex items-center gap-1.5 p-2 rounded-xl bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 tpl-row";
      div.innerHTML = `
        <input type="text" value="${text}" placeholder="Azione" required class="flex-1 min-w-0 text-xs px-2.5 py-1.5 rounded-lg bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-slate-900 dark:text-slate-100 placeholder-slate-400 dark:placeholder-slate-500 focus:outline-none focus:border-indigo-500">
        
        <div class="flex items-center gap-1 shrink-0" title="Offset Giorni">
          <input type="number" value="${days}" required class="w-12 text-xs px-1 py-1.5 rounded-lg bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-slate-900 dark:text-slate-100 text-center focus:outline-none focus:border-indigo-500">
          <span class="text-[10px] text-slate-400 font-medium">gg</span>
        </div>

        <div class="flex items-center gap-1 shrink-0" title="Offset Ore">
          <input type="number" value="${hours}" required class="w-12 text-xs px-1 py-1.5 rounded-lg bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-slate-900 dark:text-slate-100 text-center focus:outline-none focus:border-indigo-500">
          <span class="text-[10px] text-slate-400 font-medium">h</span>
        </div>

        <button type="button" onclick="this.parentElement.remove()" class="text-slate-400 hover:text-rose-500 transition p-1 shrink-0">
          <i data-lucide="trash-2" class="w-4 h-4"></i>
        </button>
      `;
      container.appendChild(div);
      lucide.createIcons();
    }

    function saveTemplate(e) {
      e.preventDefault();
      const title = document.getElementById('tpl-name').value.trim();
      const rows = document.querySelectorAll('.tpl-row');
      const items = [];

      rows.forEach(r => {
        const inputs = r.querySelectorAll('input');
        const text = inputs[0].value.trim();
        const daysOffset = parseInt(inputs[1].value, 10) || 0;
        const hoursOffset = parseInt(inputs[2].value, 10) || 0;
        if (text) items.push({ text, daysOffset, hoursOffset });
      });

      if (editingTemplateId) {
        const index = templates.findIndex(t => t.id === editingTemplateId);
        if (index !== -1) {
          templates[index] = { id: editingTemplateId, title, items };
        }
      } else {
        templates.push({ id: 'tpl-' + Date.now(), title, items });
      }

      syncStorage();
      closeModal('modal-template');
      document.getElementById('form-template').reset();
    }

    function deleteTemplate(id) {
      if (confirm("Vuoi davvero eliminare questo modello?")) {
        templates = templates.filter(t => t.id !== id);
        syncStorage();
      }
    }

    // --- LOGICA CORSI E CALCOLO ORARI ---
    function populateTemplateSelect() {
      const select = document.getElementById('course-template-select');
      select.innerHTML = '<option value="">-- Nessun modello (Vuoto) --</option>';
      templates.forEach(t => {
        select.innerHTML += `<option value="${t.id}">${t.title} (${t.items.length} step)</option>`;
      });
    }

    function saveCourse(e) {
      e.preventDefault();
      const name = document.getElementById('course-name').value.trim();
      const courseDateTimeStr = document.getElementById('course-datetime').value;
      const tplId = document.getElementById('course-template-select').value;

      const tasks = [];
      const courseDate = new Date(courseDateTimeStr);

      if (tplId) {
        const tpl = templates.find(t => t.id === tplId);
        if (tpl) {
          tpl.items.forEach(item => {
            const taskDate = new Date(courseDate.getTime());
            taskDate.setDate(taskDate.getDate() + item.daysOffset);
            taskDate.setHours(taskDate.getHours() + item.hoursOffset);

            tasks.push({
              id: 'task-' + Math.random().toString(36).substr(2, 9),
              text: item.text,
              daysOffset: item.daysOffset,
              hoursOffset: item.hoursOffset,
              dateTime: taskDate.toISOString(),
              completed: false,
              notified: false
            });
          });
        }
      }

      tasks.sort((a, b) => new Date(a.dateTime) - new Date(b.dateTime));

      courses.unshift({
        id: 'course-' + Date.now(),
        name,
        dateTime: new Date(courseDateTimeStr).toISOString(),
        tasks
      });

      syncStorage();
      closeModal('modal-course');
      document.getElementById('form-course').reset();
    }

    function toggleTask(courseId, taskId) {
      const course = courses.find(c => c.id === courseId);
      if (!course) return;
      const task = course.tasks.find(t => t.id === taskId);
      if (task) task.completed = !task.completed;
      syncStorage();
    }

    function deleteCourse(id) {
      courses = courses.filter(c => c.id !== id);
      syncStorage();
    }

    // --- NOTIFICHE WEB ---
    function requestNotificationPermission() {
      if (NativeBridge.native) { NativeBridge.requestPermission(); return; }
      if (!("Notification" in window)) {
        alert("Questo browser non supporta le notifiche di sistema.");
        return;
      }
      Notification.requestPermission().then(permission => {
        if (permission === "granted") {
          new Notification("Notifiche Memo Corsi Attive", {
            body: "Riceverai avvisi puntuali per tutte le scadenze impostate.",
            icon: ""
          });
        }
      });
    }

    function checkDueNotifications() {
      if (NativeBridge.native) return;
      if (!("Notification" in window) || Notification.permission !== "granted") return;
      const now = Date.now();
      let changed = false;

      courses.forEach(c => {
        c.tasks.forEach(t => {
          const taskTime = new Date(t.dateTime).getTime();
          if (!t.completed && taskTime <= now && (now - taskTime) < 7200000 && !t.notified) {
            new Notification(`Scadenza: ${c.name}`, {
              body: `${t.text} (${formatDateTime(t.dateTime)})`
            });
            t.notified = true;
            changed = true;
          }
        });
      });

      if (changed) {
        localStorage.setItem('memo_corsi_courses', JSON.stringify(courses));
      }
    }

    setInterval(checkDueNotifications, 30000);

    // --- FORMATTAZIONE DATE & BADGE ---
    function formatDateTime(isoString) {
      const d = new Date(isoString);
      if (isNaN(d.getTime())) return isoString;
      const dd = String(d.getDate()).padStart(2, '0');
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const yyyy = d.getFullYear();
      const hh = String(d.getHours()).padStart(2, '0');
      const min = String(d.getMinutes()).padStart(2, '0');
      return `${dd}/${mm}/${yyyy} ore ${hh}:${min}`;
    }

    function getRelativeBadge(days, hours) {
      const parts = [];
      if (days !== 0) parts.push(`${Math.abs(days)}gg`);
      if (hours !== 0) parts.push(`${Math.abs(hours)}h`);

      if (parts.length === 0) {
        return `<span class="px-2 py-0.5 text-[10px] font-semibold rounded-md bg-rose-50 text-rose-700 border border-rose-200 dark:bg-rose-950/50 dark:text-rose-400 dark:border-rose-800/40">Inizio corso</span>`;
      }

      const label = parts.join(' ');
      const isBefore = (days < 0) || (days === 0 && hours < 0);

      if (isBefore) {
        return `<span class="px-2 py-0.5 text-[10px] font-semibold rounded-md bg-amber-50 text-amber-700 border border-amber-200 dark:bg-amber-950/50 dark:text-amber-400 dark:border-amber-800/40">${label} prima</span>`;
      } else {
        return `<span class="px-2 py-0.5 text-[10px] font-semibold rounded-md bg-indigo-50 text-indigo-700 border border-indigo-200 dark:bg-indigo-950/50 dark:text-indigo-400 dark:border-indigo-800/40">${label} dopo</span>`;
      }
    }

    function render() {
      // 1. Render Corsi
      const courseContainer = document.getElementById('course-list');
      const emptyCourses = document.getElementById('empty-courses');
      courseContainer.innerHTML = '';

      if (courses.length === 0) {
        emptyCourses.classList.remove('hidden');
      } else {
        emptyCourses.classList.add('hidden');
        courses.forEach(c => {
          const completedCount = c.tasks.filter(t => t.completed).length;
          const totalCount = c.tasks.length;
          const progress = totalCount > 0 ? Math.round((completedCount / totalCount) * 100) : 0;

          const card = document.createElement('div');
          card.className = "bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-4 shadow-sm";
          card.innerHTML = `
            <div class="flex items-start justify-between pb-3 border-b border-slate-100 dark:border-slate-800/80">
              <div>
                <span class="text-[11px] font-bold text-indigo-600 dark:text-indigo-400 tracking-wider flex items-center gap-1.5">
                  <i data-lucide="clock" class="w-3.5 h-3.5"></i>
                  ${formatDateTime(c.dateTime)}
                </span>
                <h3 class="text-base font-bold text-slate-900 dark:text-white leading-tight mt-1">${c.name}</h3>
              </div>
              <button onclick="deleteCourse('${c.id}')" class="text-slate-400 hover:text-rose-500 dark:text-slate-500 dark:hover:text-rose-400 transition p-1">
                <i data-lucide="trash-2" class="w-4 h-4"></i>
              </button>
            </div>

            <!-- Barra di Avanzamento -->
            <div class="mt-3 flex items-center gap-3">
              <div class="flex-1 bg-slate-100 dark:bg-slate-800 rounded-full h-1.5 overflow-hidden">
                <div class="bg-emerald-500 h-full rounded-full transition-all duration-300" style="width: ${progress}%"></div>
              </div>
              <span class="text-[11px] text-slate-400 font-medium">${completedCount}/${totalCount}</span>
            </div>

            <!-- Lista Attività -->
            <div class="mt-4 space-y-2">
              ${c.tasks.length === 0 ? '<p class="text-xs text-slate-400 dark:text-slate-500">Nessuna azione associata.</p>' : ''}
              ${c.tasks.map(t => `
                <div class="flex items-center gap-3 p-2.5 rounded-xl border ${t.completed ? 'bg-slate-50 dark:bg-slate-950/40 border-slate-200/60 dark:border-slate-900 opacity-60' : 'bg-white dark:bg-slate-950/70 border-slate-200 dark:border-slate-800/80'} transition">
                  <input type="checkbox" ${t.completed ? 'checked' : ''} onchange="toggleTask('${c.id}', '${t.id}')" 
                    class="w-4 h-4 text-indigo-600 rounded bg-white dark:bg-slate-900 border-slate-300 dark:border-slate-700 focus:ring-indigo-500 cursor-pointer">
                  <div class="flex-1 min-w-0">
                    <p class="text-xs font-medium ${t.completed ? 'line-through text-slate-400 dark:text-slate-500' : 'text-slate-800 dark:text-slate-200'}">${t.text}</p>
                    <span class="text-[10px] text-slate-400 block">${formatDateTime(t.dateTime)}</span>
                  </div>
                  <div>${getRelativeBadge(t.daysOffset || 0, t.hoursOffset || 0)}</div>
                </div>
              `).join('')}
            </div>
          `;
          courseContainer.appendChild(card);
        });
      }

      // 2. Render Template (con Modifica ed Elimina)
      const templateContainer = document.getElementById('template-list');
      templateContainer.innerHTML = '';
      templates.forEach(t => {
        const card = document.createElement('div');
        card.className = "bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-4 shadow-sm";
        card.innerHTML = `
          <div class="flex items-center justify-between mb-2 pb-2 border-b border-slate-100 dark:border-slate-800/60">
            <h4 class="text-sm font-bold text-slate-900 dark:text-white">${t.title}</h4>
            <div class="flex items-center gap-1">
              <button onclick="openTemplateModal('${t.id}')" title="Modifica" class="text-slate-400 hover:text-indigo-600 dark:hover:text-indigo-400 transition p-1.5 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800">
                <i data-lucide="pencil" class="w-4 h-4"></i>
              </button>
              <button onclick="deleteTemplate('${t.id}')" title="Elimina" class="text-slate-400 hover:text-rose-500 dark:hover:text-rose-400 transition p-1.5 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800">
                <i data-lucide="trash-2" class="w-4 h-4"></i>
              </button>
            </div>
          </div>
          <div class="space-y-1.5 pt-1">
            ${t.items.map(i => `
              <div class="text-xs text-slate-600 dark:text-slate-300 flex items-center justify-between py-1 border-b border-slate-100 dark:border-slate-800/40 last:border-none">
                <span>• ${i.text}</span>
                <div>${getRelativeBadge(i.daysOffset || 0, i.hoursOffset || 0)}</div>
              </div>
            `).join('')}
          </div>
        `;
        templateContainer.appendChild(card);
      });

      lucide.createIcons();
    }

    // Inizializzazione
    render();
    checkDueNotifications();
    NativeBridge.init();
    NativeBridge.sync();
  </script>
</body>
</html>
